crons:
  - name: offer-reminder
    description: "Invia promemoria alle aziende in prova a 7 e 1 giorni dalla fine dell'Offerta Fondatori"
    cron: "0 9 * * *"
    endpoint: "{{BASE_URL}}/api/cron/offer-reminder"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: offer-expire
    description: "Dopo il 31/12 converte le aziende con prova scaduta e riattiva i piani a pagamento"
    cron: "30 0 * * *"
    endpoint: "{{BASE_URL}}/api/cron/offer-expire"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: offer-reactivation
    description: "Il 1 gennaio invia alle aziende con prova scaduta un'email per riattivare il PRO (link al checkout)"
    at: "2027-01-01T10:00:00Z"
    endpoint: "{{BASE_URL}}/api/cron/offer-reactivation"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: noleggio-reminder
    description: "Promemoria email 1 giorno prima della consegna per le prenotazioni di noleggio confermate (cliente + azienda)"
    cron: "0 9 * * *"
    endpoint: "{{BASE_URL}}/api/cron/noleggio-reminder"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: credits-refresh
    description: "Ricarica mensile dei 5 crediti bonus alle aziende abbonate e riallineamento dei ruoli wallet"
    cron: "0 3 1 * *"
    endpoint: "{{BASE_URL}}/api/cron/credits-refresh"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
